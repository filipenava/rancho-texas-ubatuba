name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# O site de produção segue no domínio próprio. Este deploy é uma prévia:
# `PUBLIC_NOINDEX` marca as páginas como noindex para o Google não indexar
# uma cópia concorrente do site da pousada.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build
        env:
          PUBLIC_NOINDEX: 'true'

      - name: Ajustar caminhos para o subdiretório do Pages
        run: node scripts/prefix-base.mjs ${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
